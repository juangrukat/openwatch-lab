name: Check and build
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - name: Install core (Mac)
        if: runner.os == 'macOS'
        run: .venv/bin/python -m pip install -e '.[dev]'
      - name: Install core (Windows)
        if: runner.os == 'Windows'
        run: .venv/Scripts/python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npm run check
      - name: Test core (Mac)
        if: runner.os == 'macOS'
        run: |
          .venv/bin/python -m pytest --cov=openwatch
          .venv/bin/python -m mypy
          .venv/bin/python -m ruff check packages/watch-core/openwatch
      - name: Test core (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv/Scripts/python -m pytest --cov=openwatch
          .venv/Scripts/python -m mypy
          .venv/Scripts/python -m ruff check packages/watch-core/openwatch
      - run: npm run backend:bundle
      - run: npm run package:mac
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run package:win
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
